<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Bowl Cafe | Fresh Food, Made Daily</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Green Bowl Cafe</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Fresh food, made daily</h2>
    <p id="intro">Welcome to Green Bowl Cafe. <strong>Order <em>online</em></strong> today.</p>

    <img src="images/jollof-rice.jpg" alt="A plate of smoky jollof rice served with grilled chicken">

    <div class="menu">
      <h2>Popular dishes</h2>
      <p id="menu-intro">Our most loved meals are listed below.</p>
      <ul>
        <li>Jollof rice with chicken</li>
        <li>Suya wrap</li>
      </ul>
    </div>

    <h2>Book a table</h2>
    <form action="/book" method="post">
      <label for="fullname">Full name</label>
      <input type="text" id="fullname" name="fullname">

      <label for="email">Email</label>
      <input type="email" id="email" name="email">

      <button type="submit">Reserve</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Green Bowl Cafe</p>
  </footer>
</body>
</html>
